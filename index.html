<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ぼうならべ（小学校1年生）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: 'Klee One', 'UD Digi Kyokasho NK-R', 'Hiragino Maru Gothic ProN', sans-serif;
    background: #f0f4f8;
    color: #1f2937;
  }
  #app {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  header { text-align: center; flex: none; }
  h1 { margin: 0; font-size: clamp(20px, 3.5vh, 30px); font-weight: 600; }
  header p { margin: 2px 0 0; font-size: clamp(14px, 2.2vh, 18px); color: #4b5563; }
  main {
    flex: 1; min-height: 0;
    display: flex; flex-direction: row; gap: 12px;
  }
  #stage {
    position: relative; z-index: 2;
    flex: 1; min-width: 0; min-height: 0;
    background: #fff;
    border: 4px dashed #9ca3af;
    border-radius: 12px;
    touch-action: none;
    cursor: grab;
  }
  #sticks {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    overflow: visible;
    pointer-events: none;
  }
  .stick.snapping { transition: transform 0.12s ease-out; }
  #palette {
    flex: none; width: 210px;
    background: #fff; border-radius: 12px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
    padding: 12px;
    display: flex; flex-direction: column; gap: 12px;
  }
  #tray { display: grid; grid-template-columns: 1fr; gap: 4px; flex: 1; min-height: 0; align-content: start; }
  .tray-item {
    display: block; width: 100%; height: 52px;
    touch-action: none; cursor: grab;
  }
  h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  #snap-level { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  button {
    font: inherit; font-weight: 600;
    min-height: 44px;
    touch-action: manipulation;
    border-radius: 8px;
    cursor: pointer;
  }
  .snap-btn { background: #fff; color: #374151; border: 2px solid #d1d5db; padding: 0; }
  .snap-btn[aria-pressed="true"] { background: #2563eb; color: #fff; border-color: #2563eb; }
  #clear-stage { width: 100%; background: #ef4444; color: #fff; border: none; }
  #clear-stage:hover { background: #dc2626; }
  @media (orientation: portrait) {
    main { flex-direction: column; }
    #palette { width: 100%; padding: 10px; gap: 8px; }
    #tray { grid-template-columns: repeat(4, 1fr); flex: none; }
    #tools { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; align-items: end; }
  }
  @media (orientation: landscape) and (max-height: 480px) {
    header p { display: none; }
    #palette { gap: 6px; padding: 8px; }
    .tray-item { height: 44px; }
    #tray { grid-template-columns: 1fr 1fr; flex: none; }
    h2 { font-size: 14px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>ぼうならべ</h1>
    <p>ぼうを うごかして、いろいろな かたちを つくろう。タップすると まわるよ。そとに だすと きえるよ。</p>
  </header>
  <main>
    <div id="stage" role="application" aria-label="ぼうを ならべる ばしょ">
      <svg id="sticks" aria-hidden="true">
        <g id="stick-layer"></g>
        <g id="guide-layer"></g>
      </svg>
    </div>
    <aside id="palette">
      <div id="tray">
        <svg class="tray-item" data-color="red" viewBox="-80 -26 160 52" role="img" aria-label="あかい ぼう"></svg>
        <svg class="tray-item" data-color="blue" viewBox="-80 -26 160 52" role="img" aria-label="あおい ぼう"></svg>
        <svg class="tray-item" data-color="yellow" viewBox="-80 -26 160 52" role="img" aria-label="きいろい ぼう"></svg>
        <svg class="tray-item" data-color="green" viewBox="-80 -26 160 52" role="img" aria-label="みどりの ぼう"></svg>
      </div>
      <div id="tools">
        <div>
          <h2>ぴったり</h2>
          <div id="snap-level">
            <button type="button" class="snap-btn" data-level="0">なし</button>
            <button type="button" class="snap-btn" data-level="1">ふつう</button>
            <button type="button" class="snap-btn" data-level="2">つよい</button>
          </div>
        </div>
        <button type="button" id="clear-stage" style="margin-top:12px">ぜんぶ けす</button>
      </div>
    </aside>
  </main>
</div>

<script>
// ==STICK-CORE-START==
// 棒の計算（DOMに依存しない純粋関数）
// 棒は { x, y, rot }：x,y は中心、rot は角度（30度きざみ）。同じ長さの棒だけを使う。
const STICK_LENGTH = 120;
const ROTATE_STEP = 30;   // 正三角形（60度）も正方形（90度）も作れるきざみ
const TOUCH_EPS = 0.75;   // これ以内なら「くっついている」とみなす(px)

function stickEnds(s) {
  const t = s.rot * Math.PI / 180;
  const dx = Math.cos(t) * STICK_LENGTH / 2, dy = Math.sin(t) * STICK_LENGTH / 2;
  return [[s.x - dx, s.y - dy], [s.x + dx, s.y + dy]];
}

// 点から棒（線分）への最短距離とその足。t は線分上の位置 0〜1
function nearestOnStick(px, py, s) {
  const [a, b] = stickEnds(s);
  const ex = b[0] - a[0], ey = b[1] - a[1];
  const t = Math.max(0, Math.min(1, ((px - a[0]) * ex + (py - a[1]) * ey) / (ex * ex + ey * ey)));
  const fx = a[0] + ex * t, fy = a[1] + ey * t;
  return { x: fx, y: fy, t, dist: Math.hypot(px - fx, py - fy) };
}

// 指の下の棒をさがす。細い棒でも触りやすいよう slop まで広げる。後ろの要素（上にある棒）を優先。
function pickStick(px, py, sticks, slop) {
  let best = -1, bestDist = Infinity;
  for (let i = 0; i < sticks.length; i++) {
    const d = nearestOnStick(px, py, sticks[i]).dist;
    if (d <= slop && d <= bestDist) { best = i; bestDist = d; }
  }
  return best;
}

// 同じ直線上で重なってしまう（くっつくのではなく、かぶる）か
function sticksOverlapInline(a, b) {
  const [a0, a1] = stickEnds(a);
  const [b0, b1] = stickEnds(b);
  const ux = (a1[0] - a0[0]) / STICK_LENGTH, uy = (a1[1] - a0[1]) / STICK_LENGTH;
  const cross = ux * (b1[1] - b0[1]) / STICK_LENGTH - uy * (b1[0] - b0[0]) / STICK_LENGTH;
  if (Math.abs(cross) > 1e-3) return false;
  if (Math.abs((b0[0] - a0[0]) * uy - (b0[1] - a0[1]) * ux) > 1) return false;
  const t0 = (b0[0] - a0[0]) * ux + (b0[1] - a0[1]) * uy;
  const t1 = (b1[0] - a0[0]) * ux + (b1[1] - a0[1]) * uy;
  return Math.min(STICK_LENGTH, Math.max(t0, t1)) - Math.max(0, Math.min(t0, t1)) > 1;
}

// 棒の端がほかの棒にどう触れているかを数える
function countTouches(s, others) {
  const touchPoints = [];
  let endHits = 0, midHits = 0, bodyHits = 0;
  for (const [x, y] of stickEnds(s)) {
    let kind = 0;
    for (const o of others) {
      for (const [ox, oy] of stickEnds(o)) {
        if (Math.hypot(ox - x, oy - y) <= TOUCH_EPS) kind = 3;
      }
      if (kind < 2 && Math.hypot(o.x - x, o.y - y) <= TOUCH_EPS) kind = 2;
      if (kind < 1 && nearestOnStick(x, y, o).dist <= TOUCH_EPS) kind = 1;
    }
    if (kind === 3) endHits++;
    if (kind === 2) midHits++;
    if (kind === 1) bodyHits++;
    if (kind > 0) touchPoints.push([x, y]);
  }
  return { endHits, midHits, bodyHits, touchPoints };
}

// 棒を近くの棒の「端」「まんなか」「とちゅう」に合わせる移動量を求める。なければ null。
function findSnap(moving, others, radius) {
  if (!(radius > 0) || !others || others.length === 0) return null;
  const reach = STICK_LENGTH + radius * 1.5;
  const near = others.filter(o => Math.hypot(o.x - moving.x, o.y - moving.y) <= reach);
  if (near.length === 0) return null;

  const cands = [];
  for (const [x, y] of stickEnds(moving)) {
    for (const o of near) {
      for (const [ox, oy] of stickEnds(o)) cands.push([ox - x, oy - y]);
      cands.push([o.x - x, o.y - y]);
      const foot = nearestOnStick(x, y, o);
      if (foot.t > 0 && foot.t < 1) cands.push([foot.x - x, foot.y - y]);
    }
  }

  let best = null;
  for (const [dx, dy] of cands) {
    const dist = Math.hypot(dx, dy);
    if (dist > radius) continue;
    const shifted = { x: moving.x + dx, y: moving.y + dy, rot: moving.rot };
    if (near.some(o => sticksOverlapInline(shifted, o))) continue;
    const t = countTouches(shifted, near);
    if (t.touchPoints.length === 0) continue;
    const score = 100 * t.endHits + 40 * t.midHits + 10 * t.bodyHits - dist;
    if (!best || score > best.score + 1e-9) {
      best = { dx, dy, score, x: shifted.x, y: shifted.y, touchPoints: t.touchPoints };
    }
  }
  return best;
}

// タップで回す。端が1つだけつながっていれば、そこを軸に回す（つながりが切れない）。
// それ以外は棒のまんなかで回す。pivoted が true なら吸いつき不要。
function rotateStick(s, others, usePivot) {
  const rot = (s.rot + ROTATE_STEP) % 360;
  if (usePivot) {
    const touching = stickEnds(s).filter(([x, y]) =>
      others.some(o => nearestOnStick(x, y, o).dist <= TOUCH_EPS));
    if (touching.length === 1) {
      const [px, py] = touching[0];
      const t = ROTATE_STEP * Math.PI / 180;
      const vx = s.x - px, vy = s.y - py;
      return {
        x: px + vx * Math.cos(t) - vy * Math.sin(t),
        y: py + vx * Math.sin(t) + vy * Math.cos(t),
        rot, pivoted: true,
      };
    }
  }
  return { x: s.x, y: s.y, rot, pivoted: false };
}

// 棒全体がステージに入るように中心の位置を直す
function clampStick(s, w, h, margin) {
  const t = s.rot * Math.PI / 180;
  const ex = Math.abs(Math.cos(t)) * STICK_LENGTH / 2 + margin;
  const ey = Math.abs(Math.sin(t)) * STICK_LENGTH / 2 + margin;
  const fit = (v, half, size) => size <= half * 2 ? size / 2 : Math.max(half, Math.min(size - half, v));
  return { x: fit(s.x, ex, w), y: fit(s.y, ey, h), rot: s.rot };
}
// ==STICK-CORE-END==

const COLORS = {
  red: ['#ef4444', '#b91c1c'],
  blue: ['#3b82f6', '#1d4ed8'],
  yellow: ['#facc15', '#a16207'],
  green: ['#10b981', '#047857'],
};
const STICK_WIDTH = 14;
const HIT_SLOP = 22;      // 指で触れる範囲（幅44px相当）
const TAP_SLOP = 8;       // これより小さい動きはタップ（回転）
const SNAP_RADII = [0, 25, 45];
const SVG_NS = 'http://www.w3.org/2000/svg';

const stage = document.getElementById('stage');
const stickLayer = document.getElementById('stick-layer');
const guideLayer = document.getElementById('guide-layer');

let sticks = [];   // { x, y, rot, color, el }（配列の後ろほど上）
let drag = null;
let guideFrame = 0;

let snapLevel = 1;
try {
  const saved = localStorage.getItem('bou-snap-level');
  if (saved !== null && SNAP_RADII[+saved] !== undefined) snapLevel = +saved;
} catch (e) { /* 保存できない環境では既定値 */ }

const levelButtons = document.querySelectorAll('#snap-level .snap-btn');
function renderLevel() {
  levelButtons.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.level === snapLevel)));
}
levelButtons.forEach(b => b.addEventListener('click', () => {
  snapLevel = +b.dataset.level;
  try { localStorage.setItem('bou-snap-level', String(snapLevel)); } catch (e) {}
  renderLevel();
}));
renderLevel();

function stickLines(parent, color) {
  const half = STICK_LENGTH / 2;
  [[STICK_WIDTH, COLORS[color][1]], [STICK_WIDTH - 4, COLORS[color][0]]].forEach(([w, c]) => {
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', -half); line.setAttribute('y1', 0);
    line.setAttribute('x2', half); line.setAttribute('y2', 0);
    line.setAttribute('stroke', c);
    line.setAttribute('stroke-width', w);
    line.setAttribute('stroke-linecap', 'round');
    parent.appendChild(line);
  });
}
document.querySelectorAll('.tray-item').forEach(item => stickLines(item, item.dataset.color));

function place(s) {
  s.el.style.transform = `translate(${s.x}px, ${s.y}px) rotate(${s.rot}deg)`;
}
function addStick(color, x, y) {
  const el = document.createElementNS(SVG_NS, 'g');
  el.setAttribute('class', 'stick');
  stickLines(el, color);
  stickLayer.appendChild(el);
  const s = { x, y, rot: 0, color, el };
  sticks.push(s);
  place(s);
  return s;
}
function removeStick(s) {
  s.el.remove();
  sticks = sticks.filter(o => o !== s);
}
function bringToFront(s) {
  sticks = sticks.filter(o => o !== s);
  sticks.push(s);
  stickLayer.appendChild(s.el);
}
function othersOf(s) { return sticks.filter(o => o !== s); }
function stagePoint(e) {
  const r = stage.getBoundingClientRect();
  return { x: e.clientX - r.left - stage.clientLeft, y: e.clientY - r.top - stage.clientTop };
}

// ---- ガイド ----
function clearGuide() {
  while (guideLayer.firstChild) guideLayer.removeChild(guideLayer.firstChild);
}
function drawGuide(snap, rot) {
  clearGuide();
  if (!snap) return;
  const [a, b] = stickEnds({ x: snap.x, y: snap.y, rot });
  const line = document.createElementNS(SVG_NS, 'line');
  line.setAttribute('x1', a[0]); line.setAttribute('y1', a[1]);
  line.setAttribute('x2', b[0]); line.setAttribute('y2', b[1]);
  line.setAttribute('stroke', '#2563eb');
  line.setAttribute('stroke-width', '3');
  line.setAttribute('stroke-dasharray', '7 6');
  guideLayer.appendChild(line);
  for (const [x, y] of snap.touchPoints) {
    const dot = document.createElementNS(SVG_NS, 'circle');
    dot.setAttribute('cx', x); dot.setAttribute('cy', y);
    dot.setAttribute('r', '10');
    dot.setAttribute('fill', 'rgba(37, 99, 235, 0.25)');
    dot.setAttribute('stroke', '#2563eb');
    dot.setAttribute('stroke-width', '2');
    guideLayer.appendChild(dot);
  }
}
function updateGuide() {
  guideFrame = 0;
  if (!drag) return;
  const radius = SNAP_RADII[snapLevel];
  drawGuide(radius > 0 ? findSnap(drag.stick, othersOf(drag.stick), radius) : null, drag.stick.rot);
}

// 吸いつかせて、ステージ内におさめる
function settle(s) {
  const snap = findSnap(s, othersOf(s), SNAP_RADII[snapLevel]);
  let next = { x: s.x, y: s.y, rot: s.rot };
  if (snap) { next.x = snap.x; next.y = snap.y; }
  next = clampStick(next, stage.clientWidth, stage.clientHeight, STICK_WIDTH / 2);
  if (Math.abs(next.x - s.x) > 0.01 || Math.abs(next.y - s.y) > 0.01) {
    s.el.classList.add('snapping');
    setTimeout(() => s.el.classList.remove('snapping'), 150);
  }
  s.x = next.x; s.y = next.y;
  place(s);
}

// ---- ドラッグ（setPointerCapture を使わず window で受ける） ----
function startDrag(e, s, fromTray) {
  s.el.classList.remove('snapping');
  const pt = stagePoint(e);
  drag = {
    stick: s, fromTray,
    pointerId: e.pointerId,
    offX: fromTray ? 0 : pt.x - s.x,
    offY: fromTray ? 0 : pt.y - s.y,
    startX: e.clientX, startY: e.clientY,
    moved: false,
  };
  bringToFront(s);
  e.preventDefault();
}

stage.addEventListener('pointerdown', (e) => {
  if (drag) return; // 2本目の指は無視
  const pt = stagePoint(e);
  const i = pickStick(pt.x, pt.y, sticks, HIT_SLOP);
  if (i >= 0) startDrag(e, sticks[i], false);
});

document.getElementById('tray').addEventListener('pointerdown', (e) => {
  if (drag) return;
  const item = e.target.closest('.tray-item');
  if (!item) return;
  const pt = stagePoint(e);
  startDrag(e, addStick(item.dataset.color, pt.x, pt.y), true);
});

window.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  e.preventDefault();
  if (!drag.moved && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) > TAP_SLOP) drag.moved = true;
  if (!drag.moved) return;
  const pt = stagePoint(e);
  drag.stick.x = pt.x - drag.offX;
  drag.stick.y = pt.y - drag.offY;
  place(drag.stick);
  if (!guideFrame) guideFrame = requestAnimationFrame(updateGuide);
}, { passive: false });

function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const { stick, moved, fromTray } = drag;
  drag = null;
  if (guideFrame) { cancelAnimationFrame(guideFrame); guideFrame = 0; }
  clearGuide();

  // ステージの外に出したら消す（棒の中心で判定）
  if (stick.x < 0 || stick.y < 0 || stick.x > stage.clientWidth || stick.y > stage.clientHeight) {
    removeStick(stick);
    return;
  }
  if (!moved && !fromTray) {
    if (cancelled) return;
    const r = rotateStick(stick, othersOf(stick), snapLevel > 0);
    stick.x = r.x; stick.y = r.y; stick.rot = r.rot;
    place(stick);
    if (r.pivoted) {
      // 軸で回して枠の外へ出たときだけ、さわれる位置へ戻す
      const c = clampStick(stick, stage.clientWidth, stage.clientHeight, STICK_WIDTH / 2);
      stick.x = c.x; stick.y = c.y;
      place(stick);
      return;
    }
  }
  settle(stick);
}
window.addEventListener('pointerup', (e) => endDrag(e, false));
window.addEventListener('pointercancel', (e) => endDrag(e, true));

// 画面の向きが変わったら、形をくずさないよう全体を動かしてステージにおさめる
window.addEventListener('resize', () => {
  if (sticks.length === 0) return;
  const w = stage.clientWidth, h = stage.clientHeight, m = STICK_WIDTH / 2;
  const pts = sticks.flatMap(stickEnds);
  const minX = Math.min(...pts.map(p => p[0])), maxX = Math.max(...pts.map(p => p[0]));
  const minY = Math.min(...pts.map(p => p[1])), maxY = Math.max(...pts.map(p => p[1]));
  const dx = maxX + m > w ? Math.max(w - m - maxX, m - minX) : 0;
  const dy = maxY + m > h ? Math.max(h - m - maxY, m - minY) : 0;
  for (const s of sticks) {
    const c = clampStick({ x: s.x + dx, y: s.y + dy, rot: s.rot }, w, h, m);
    s.x = c.x; s.y = c.y;
    place(s);
  }
});

document.getElementById('clear-stage').addEventListener('click', () => {
  if (sticks.length === 0) return;
  if (window.confirm('ぼうを ぜんぶ けしますか？')) {
    sticks.forEach(s => s.el.remove());
    sticks = [];
  }
});

// iOS のピンチズームと長押しメニューをおさえる
document.addEventListener('gesturestart', (e) => e.preventDefault());
stage.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
</body>
</html>
